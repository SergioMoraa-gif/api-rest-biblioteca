spring.application.name=libreria
server.port=${SERVER_PORT:1500}

# Credenciales por variables de entorno (no se suben valores reales a GitHub).
# Si una variable no existe se usa el valor después de los dos puntos.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/libreria?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
